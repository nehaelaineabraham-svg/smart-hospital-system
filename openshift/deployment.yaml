apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediflow
  labels:
    app: mediflow
    app.kubernetes.io/part-of: mediflow-hospital
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mediflow
  template:
    metadata:
      labels:
        app: mediflow
    spec:
      containers:
        - name: mediflow
          image: image-registry.openshift-image-registry.svc:5000/mediflow/mediflow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /login/
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login/
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mediflow
  labels:
    app: mediflow
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: mediflow
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mediflow
  labels:
    app: mediflow
spec:
  to:
    kind: Service
    name: mediflow
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
